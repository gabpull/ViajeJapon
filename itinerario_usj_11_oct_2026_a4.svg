  <rect x="145" y="2885" width="690" height="425" rx="26" fill="#173B5C"/>
  <circle cx="210" cy="2950" r="32" fill="#FFC928"/><text x="210" y="2952" text-anchor="middle" dominant-baseline="central" font-size="31" font-weight="900">A</text>
  <text x="260" y="2962" class="white" font-size="31" font-weight="900">ANTES DE LLEGAR</text>
  <text x="190" y="3020" fill="#D8E8F4" font-size="28">+ App oficial actualizada.</text>
  <text x="190" y="3067" fill="#D8E8F4" font-size="28">+ Registrar todos los pases.</text>
  <text x="190" y="3114" fill="#D8E8F4" font-size="28">+ Datos móviles + batería externa.</text>
  <text x="190" y="3161" fill="#D8E8F4" font-size="28">+ Desayuno antes de la fila.</text>
  <text x="190" y="3208" fill="#D8E8F4" font-size="28">+ No correr; caminar decidido.</text>

  <rect x="895" y="2885" width="690" height="425" rx="26" fill="#173B5C"/>
  <circle cx="960" cy="2950" r="32" fill="#FF5A36"/><text x="960" y="2952" class="white" text-anchor="middle" dominant-baseline="central" font-size="31" font-weight="900">B</text>
  <text x="1010" y="2962" class="white" font-size="31" font-weight="900">PLAN NINTENDO</text>
  <text x="940" y="3020" fill="#D8E8F4" font-size="28">+ Si hay acceso libre: entren directo.</text>
  <text x="940" y="3067" fill="#D8E8F4" font-size="28">+ Si pide franja: reserven al cruzar.</text>
  <text x="940" y="3114" fill="#D8E8F4" font-size="28">+ Lleguen 15 min antes de la franja.</text>
  <text x="940" y="3161" fill="#D8E8F4" font-size="28">+ No desinstalen ni cierren sesión.</text>
  <text x="940" y="3208" fill="#D8E8F4" font-size="28">+ Una reserva conjunta para el grupo.</text>

  <rect x="1645" y="2885" width="690" height="425" rx="26" fill="#173B5C"/>
  <circle cx="1710" cy="2950" r="32" fill="#37B6A5"/><text x="1710" y="2952" class="white" text-anchor="middle" dominant-baseline="central" font-size="31" font-weight="900">C</text>
  <text x="1760" y="2962" class="white" font-size="31" font-weight="900">PARA GANAR TIEMPO</text>
  <text x="1690" y="3020" fill="#D8E8F4" font-size="28">+ Comer antes de 11:30 / después 15:00.</text>
  <text x="1690" y="3067" fill="#D8E8F4" font-size="28">+ Single Rider cuando esté habilitado.</text>
  <text x="1690" y="3114" fill="#D8E8F4" font-size="28">+ Revisar esperas antes de cada tramo.</text>
  <text x="1690" y="3161" fill="#D8E8F4" font-size="28">+ Shows y cierres cambian: ver la app.</text>
  <text x="1690" y="3208" fill="#D8E8F4" font-size="28">+ Compras únicamente al salir.</text>

  <text x="1240" y="3382" text-anchor="middle" fill="#89A6BC" font-size="23">Horario y eventos sujetos a cambios · Verificar la app oficial la noche anterior y al entrar · Mapa no a escala</text>
