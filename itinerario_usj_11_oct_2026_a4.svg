      .body { font-size: 32px; }
      .label { font-size: 31px; font-weight: 700; }
      .time { font-size: 31px; font-weight: 800; fill: #0C6E76; }
      .step { fill: #FF5A36; stroke: #fff; stroke-width: 8; }
      .stepText { fill: #fff; font-size: 32px; font-weight: 900; text-anchor: middle; dominant-baseline: central; }
      .area { stroke: #fff; stroke-width: 8; filter: url(#shadow); }
      .areaTitle { font-size: 30px; font-weight: 900; text-anchor: middle; }
      .areaSub { font-size: 24px; font-weight: 600; text-anchor: middle; fill: #345; }
    </style>
  </defs>

  <rect width="2480" height="3508" fill="url(#bg)"/>
